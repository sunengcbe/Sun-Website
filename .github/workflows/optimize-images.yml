# Keeps photos small so the site stays fast on phones.
# After any image upload (Pages CMS or GitHub): converts iPhone HEIC to JPG,
# turns big PNG photos into JPG, shrinks oversized pictures, updates the
# website files that use renamed pictures, and republishes the site.
name: Optimize images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "_data/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow pillow-heif

      - name: Optimize images
        run: python .github/scripts/optimize_images.py

      - name: Commit smaller images
        id: commit
        run: |
          git add -A images _data _includes _layouts css *.html
          if git diff --cached --quiet; then
            echo "Images are already optimized."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize images"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow don't start a new site build on their own.
      - name: Republish the website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Could not request a rebuild; the next edit will publish it."
