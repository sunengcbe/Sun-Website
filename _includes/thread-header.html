    <section class="page-header1{% if include.nut %} has-nut{% endif %}{% if include.rolling %} has-nut has-roll{% endif %}">

    <!-- =========================================
         SEAMLESS ANIMATED THREAD PROFILE
    ========================================== -->
    {%- if include.rolling %}
    <!-- Thread rolling machine: two stainless dies + black oxide bar (js/thread-roll.js) -->
    <canvas class="nut-canvas roll-canvas" aria-hidden="true" data-gap="8" data-die-length="130"></canvas>
    {%- elsif include.nut %}
    <!-- Threaded bar with a spinning nut (js/thread-nut.js) -->
    <canvas class="nut-canvas" aria-hidden="true"
            data-travel-seconds="70" data-gap="8"></canvas>
    {%- else %}
    <div class="header-thread" aria-hidden="true">

        <svg
            class="thread-svg"
            viewBox="0 0 1200 240"
            preserveAspectRatio="none"
            xmlns="http://www.w3.org/2000/svg"
        >
            <defs>

                <!-- EXACT ONE REPEATING PATTERN -->
                <path
                    id="threadPattern"
                    d="
                        M 0 180

                        L 35 180

                        L 105 65
                        C 112 52, 122 45, 138 45
                        L 162 45
                        C 178 45, 188 52, 195 65

                        L 265 180

                        L 335 180

                        L 405 65
                        C 412 52, 422 45, 438 45
                        L 462 45
                        C 478 45, 488 52, 495 65

                        L 565 180

                        L 600 180
                    "
                />

            </defs>
            <!-- PATTERN 1 -->
            <use
                href="#threadPattern"
                class="thread-path"
                x="0"
                y="0"
            />

            <!-- PATTERN 2 - EXACT COPY -->
            <use
                href="#threadPattern"
                class="thread-path"
                x="600"
                y="0"
            />

        </svg>

    </div>
    {%- endif %}


    <!-- =========================================
         HEADER CONTENT
    ========================================== -->
    <div class="container header-content1">

        <span class="section-tag reveal">
            {{ include.tag }}
        </span>

        <h1 class="page-title reveal">
            {{ include.title }}
        </h1>

        <p class="page-intro reveal">
            {{ include.intro }}
        </p>

    </div>

</section>
