{%- assign pp = site.data.products.preview -%}
    <!-- PRODUCTS PREVIEW SECTION START -->
    <section class="section products-preview{% if include.alt %} alt{% endif %}">
      <div class="container">
        <div class="section-head center reveal">
          <span class="section-tag">{{ pp.tag }}</span>
          <h2 class="section-title">{{ pp.title }}</h2>
          <p class="section-intro">{{ pp.intro }}</p>
        </div>
        <div class="pp-grid">
          {%- for product in site.data.products.items %}
          <a href="products" class="pp-card reveal">
            <img loading="lazy" decoding="async" src="{{ product.image | remove_first: '/' }}" alt="{{ product.name }}" />
            <span class="pp-name">{{ product.name }}</span>
          </a>
          {%- endfor %}
        </div>
        <div class="section-head center reveal" style="margin-top: var(--space-4); margin-bottom: 0;">
          <a href="products" class="btn btn-primary">{{ pp.button }}</a>
        </div>
      </div>
    </section>
    <!-- PRODUCTS PREVIEW SECTION END -->
