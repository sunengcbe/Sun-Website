{%- assign preview = site.data.gallery.preview -%}
    <!-- GALLERY PREVIEW SECTION START -->
    <section id="gallery" class="section gallery{% if include.alt %} alt{% endif %}">
      <div class="container">
        <div class="section-head center reveal">
          <span class="section-tag">{{ preview.tag }}</span>
          <h2 class="section-title">{{ preview.title }}</h2>
          <p class="section-intro">{{ preview.intro }}</p>
        </div>
        <div class="gallery-grid preview">
          {%- for item in site.data.gallery.items limit: preview.count %}
{% include gallery-item.html item=item %}
          {%- endfor %}
        </div>
        <div class="section-head center reveal" style="margin-top: var(--space-4);">
          <a href="gallery.html" class="btn btn-primary">{{ preview.button }}</a>
        </div>
      </div>
    </section>
    <!-- GALLERY PREVIEW SECTION END -->
