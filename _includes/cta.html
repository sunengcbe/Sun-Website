    <!-- CTA BANNER START -->
    <section class="cta-banner">
      <div class="container cta-content reveal">
        <h2 class="cta-title">{{ include.title }}</h2>
        {%- assign cta_title = include.title | downcase %}
        {%- if cta_title contains "quote" %}
        <a href="quote" class="btn btn-light">{{ site.data.quote.cta_button | default: "Get a Quote" }}</a>
        {%- else %}
        <a href="contact" class="btn btn-light">{{ site.data.company.cta_button }}</a>
        {%- endif %}
      </div>
    </section>
    <!-- CTA BANNER END -->
